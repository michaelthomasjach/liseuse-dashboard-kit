            - generic [ref=f6e368]: "@description \"///Croisement de moyennes///"
            - generic [ref=f6e369]: Long quand la moyenne courte croise la longue à la hausse, sortie au croisement inverse.
            - generic [ref=f6e371]: //À quoi ça sert//
            - generic [ref=f6e372]: "C'est la stratégie de référence : celle à laquelle comparer les autres. Si une règle compliquée ne"
            - generic [ref=f6e373]: bat pas celle-ci sur le même instrument, elle ne vaut pas sa complexité.
            - generic [ref=f6e375]: //Ce qu'il faut regarder dans le panneau//
            - generic [ref=f6e376]: Le **facteur de profit** (au-dessus de 1, elle gagne), le **drawdown max** (ce qu'il a fallu
            - generic [ref=f6e377]: encaisser pour l'obtenir), et la part des **commissions** dans le profit brut.
            - generic [ref=f6e378]: "\""
            - generic [ref=f6e380]: "@block Réglages"
            - generic [ref=f6e382]: "const COURTE = new Variable(\"number\", 20, { description: \"Période de la moyenne courte.\", min: 2, max: 200 });"
            - generic [ref=f6e383]: "const LONGUE = new Variable(\"number\", 50, { description: \"Période de la moyenne longue.\", min: 3, max: 400 });"
            - generic [ref=f6e385]: "@block Les deux moyennes, et leur position à la bougie précédente"
            - generic [ref=f6e387]: const courte = math.sma(market.series("close", COURTE), COURTE);
            - generic [ref=f6e388]: const longue = math.sma(market.series("close", LONGUE), LONGUE);
            - generic [ref=f6e390]: // Un croisement se détecte par un CHANGEMENT de position relative, pas par la position elle-même.
            - generic [ref=f6e391]: // Sans cette mémoire, "courte au-dessus de longue" resterait vrai pendant toute une tendance et on
            - generic [ref=f6e392]: // tenterait une entrée à chaque bougie — que le pyramiding se contenterait d'ignorer en silence.
            - generic [ref=f6e393]: const auDessusAvant = state.get("auDessus", null);
            - generic [ref=f6e394]: "const auDessus = courte !== null && longue !== null ? courte > longue : null;"
            - generic [ref=f6e395]: state.set("auDessus", auDessus);
            - generic [ref=f6e397]: "@block Les règles"
            - generic [ref=f6e399]: "if (auDessus !== null && auDessusAvant !== null && auDessus !== auDessusAvant) {"
            - generic [ref=f6e400]: if (auDessus) strategy.long("Croisement haussier");
            - generic [ref=f6e401]: else strategy.close("Croisement baissier");
            - generic [ref=f6e402]: "}"
