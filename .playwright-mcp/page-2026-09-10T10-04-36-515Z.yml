                - generic [ref=f6e523]: "@strategy @description \"///Croisement de moyennes/// Long quand la moyenne courte croise la longue à la hausse, sortie au croisement inverse. //À quoi ça sert// C'est la stratégie de référence : celle à laquelle comparer les autres. Si une règle compliquée ne bat pas celle-ci sur le même instrument, elle ne vaut pas sa complexité. //Ce qu'il faut regarder dans le panneau// Le **facteur de profit** (au-dessus de 1, elle gagne), le **drawdown max** (ce qu'il a fallu encaisser pour l'obtenir), et la part des **commissions** dans le profit brut. \""
