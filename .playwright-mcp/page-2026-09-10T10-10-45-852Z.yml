                    - button "Supprimer Les deux moyennes, et leur position à la bougie précédente" [ref=f24e459] [cursor=pointer]
                - generic [ref=f24e462]: "const courte = math.sma(market.series(\"close\", COURTE), COURTE); const longue = math.sma(market.series(\"close\", LONGUE), LONGUE); // Un croisement se détecte par un CHANGEMENT de position relative, pas par la position elle-même. // Sans cette mémoire, \"courte au-dessus de longue\" resterait vrai pendant toute une tendance et on // tenterait une entrée à chaque bougie — que le pyramiding se contenterait d'ignorer en silence. const auDessusAvant = state.get(\"auDessus\", null); const auDessus = courte !== null && longue !== null ? courte > longue : null; state.set(\"auDessus\", auDessus);"
                - generic "Glisser vers un autre bloc pour le faire suivre celui-ci" [ref=f24e463]
